<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Georgia Community Navigator architecture</title>
  <desc id="desc">Three stages: accept Telegram updates durably, process guide or evaluated AI assistance, then validate and deliver with receipts. PostgreSQL owns state across all stages; Redis Streams transports work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60769a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .heading { fill: #15263e; font-size: 23px; font-weight: 650; }
      .body { fill: #425773; font-size: 18px; }
      .caption { fill: #516782; font-size: 16px; }
      .edge { fill: none; stroke: #60769a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="510" rx="20" fill="#f6f8fc"/>
  <text x="36" y="48" fill="#15263e" font-size="28" font-weight="700">Georgia Community Navigator</text>
  <text x="36" y="80" class="body">Durable workflow · source-aware assistance · explicit external outcomes</text>

  <rect x="36" y="118" width="338" height="226" rx="14" fill="#ffffff" stroke="#d7e1ef"/>
  <rect x="431" y="118" width="338" height="226" rx="14" fill="#ffffff" stroke="#d7e1ef"/>
  <rect x="826" y="118" width="338" height="226" rx="14" fill="#ffffff" stroke="#d7e1ef"/>

  <text x="60" y="157" class="heading">1. Accept</text>
  <text x="60" y="198" class="body">Telegram → FastAPI webhook</text>
  <text x="60" y="233" class="body">Atomic inbox, turn and outbox</text>
  <text x="60" y="268" class="body">Tenant scope and deduplication</text>
  <text x="60" y="313" class="caption">Commit before handing off work</text>

  <text x="455" y="157" class="heading">2. Process</text>
  <text x="455" y="198" class="body">Redis Streams → worker claim</text>
  <text x="455" y="233" class="body">Guide: cards, sources and files</text>
  <text x="455" y="268" class="body">Assistance: evidence + model</text>
  <text x="455" y="313" class="caption">Admission, limits and output checks</text>

  <text x="850" y="157" class="heading">3. Deliver</text>
  <text x="850" y="198" class="body">Persist response and pending state</text>
  <text x="850" y="233" class="body">Sender checks and part receipts</text>
  <text x="850" y="268" class="body">Confirmed / rejected / unknown</text>
  <text x="850" y="313" class="caption">No blind replay after uncertainty</text>

  <path d="M 380 224 H 423" class="edge"/>
  <path d="M 775 224 H 818" class="edge"/>
  <path d="M 205 344 V 379" fill="none" stroke="#90a3bc" stroke-width="2"/>
  <path d="M 600 344 V 379" fill="none" stroke="#90a3bc" stroke-width="2"/>
  <path d="M 995 344 V 379" fill="none" stroke="#90a3bc" stroke-width="2"/>
  <rect x="36" y="379" width="1128" height="65" rx="12" fill="#e7effb" stroke="#cad9ee"/>
  <text x="60" y="419" fill="#223f6d" font-size="21" font-weight="600">PostgreSQL owns durable state, task context, attempts and delivery receipts</text>
  <text x="36" y="481" class="caption">Logical component view. The conversational-assistance path is implemented and remains under evaluation.</text>
</svg>
