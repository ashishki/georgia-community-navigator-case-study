<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
  <title id="title">Guide and AI assistance with shared task context</title>
  <desc id="desc">Telegram connects to a reference guide and AI assistance. Both modes use shared task memory and source-version checks. Persistent jobs and delivery receipts support recovery. PostgreSQL keeps state and Redis Streams transports work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#617796"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .heading { fill: #182e49; font-size: 24px; font-weight: 650; }
      .body { fill: #415975; font-size: 20px; }
      .edge { fill: none; stroke: #617796; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="670" rx="20" fill="#f6f8fc"/>
  <text x="28" y="45" fill="#182e49" font-size="28" font-weight="700">Two working modes, one continuous task</text>
  <text x="28" y="78" class="body">Guide · AI assistance · task memory · source checks · recovery</text>

  <rect x="28" y="190" width="200" height="130" rx="14" fill="#ffffff" stroke="#d5e0ee"/>
  <text x="50" y="231" class="heading">Telegram</text>
  <text x="50" y="267" class="body">Ask, clarify,</text>
  <text x="50" y="294" class="body">return to a task</text>

  <rect x="290" y="105" width="300" height="100" rx="14" fill="#ffffff" stroke="#d5e0ee"/>
  <text x="312" y="144" class="heading">Reference guide</text>
  <text x="312" y="179" class="body">Illustrated steps + sources</text>

  <rect x="290" y="265" width="300" height="100" rx="14" fill="#ffffff" stroke="#d5e0ee"/>
  <text x="312" y="304" class="heading">AI assistance</text>
  <text x="312" y="339" class="body">Clarify + explain next steps</text>

  <path d="M 228 255 H 253 V 155 H 282" class="edge"/>
  <path d="M 253 255 V 315 H 282" class="edge"/>
  <path d="M 596 155 H 642" class="edge"/>
  <path d="M 596 315 H 642" class="edge"/>

  <rect x="650" y="105" width="322" height="260" rx="14" fill="#eaf1fc" stroke="#c9d9ee"/>
  <text x="672" y="143" class="heading">Shared context</text>
  <line x1="672" y1="162" x2="950" y2="162" stroke="#c9d9ee"/>
  <text x="672" y="194" class="heading">Task memory</text>
  <text x="672" y="225" class="body">Facts, corrections, next step</text>
  <line x1="672" y1="246" x2="950" y2="246" stroke="#c9d9ee"/>
  <text x="672" y="280" class="heading">Source validity</text>
  <text x="672" y="312" class="body">Versions + withdrawal checks</text>

  <path d="M 811 365 V 427" class="edge"/>
  <rect x="290" y="435" width="682" height="100" rx="14" fill="#ffffff" stroke="#d5e0ee"/>
  <text x="312" y="474" class="heading">Processing and delivery that can recover</text>
  <text x="312" y="509" class="body">Persistent jobs · part receipts · explicit unknown outcomes</text>
  <path d="M 290 485 H 128 V 328" class="edge"/>

  <rect x="28" y="585" width="944" height="57" rx="12" fill="#e7effb" stroke="#c9d9ee"/>
  <text x="50" y="622" fill="#25446f" font-size="22" font-weight="600">PostgreSQL keeps state · Redis Streams moves work</text>
</svg>
